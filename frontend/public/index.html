<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>U-FAST -- University - Faculty Academic Scheduling Tool</title>
    <script>
      /* My settings: apply the cached display settings before the first paint (no flash of the wrong theme or text size). */
      (function () {
        var d = document.documentElement, p = null;
        try { p = JSON.parse(window.localStorage.getItem("ufast_display") || "null"); } catch (e) { p = null; }
        p = p || {};
        var size = { small: 0.9, medium: 1, large: 1.125 }[p.text_size] ? p.text_size : "medium";
        var pref = ["royal", "dark"].includes(p.theme) ? p.theme : "light"; /* Default, Royal, or Dark */
        d.setAttribute("data-theme-pref", pref);
        d.setAttribute("data-theme", pref);
        d.setAttribute("data-text-size", size);
        d.setAttribute("data-density", p.table_density === "compact" ? "compact" : "comfortable");
        d.setAttribute("data-reduce-motion", p.reduce_motion === "on" || p.reduce_motion === "off" ? p.reduce_motion : "system");
        d.style.setProperty("--ui-zoom", String({ small: 0.9, medium: 1, large: 1.125 }[size]));
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
